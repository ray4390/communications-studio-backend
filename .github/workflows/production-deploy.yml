name: Validate and Deploy Communications Studio Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated main commit to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: communications-studio-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate production helpers
        shell: bash
        run: bash -n scripts/production-systemd-control.sh scripts/activate-production-autodeploy.sh

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        env:
          SENTRY_DSN: ''
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy through systemd
    needs: validate
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
    runs-on: [self-hosted, linux, ray-server, production, communications-studio]
    environment: production
    timeout-minutes: 10
    env:
      CONTROL: /usr/local/bin/communications-studio-systemd-control
      SENTINEL: /home/deploy/.communications-studio-autodeploy-enabled
      PUBLIC_API_BASE: https://ray-500-c60.tail6f3caa.ts.net
      LEGACY_PUBLIC_API_BASE: https://ray-500-c60.tail6f3caa.ts.net:10000
      FRONTEND_ORIGIN: https://nationalarchivesusar.github.io
    steps:
      - name: Verify production activation
        id: activation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$SENTINEL" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Communications Studio production auto-deploy is enabled.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Communications Studio production auto-deploy is disabled; deployment will be skipped.'
          fi

      - name: Verify current public login route
        if: steps.activation.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          check_route() {
            local label="$1"
            local base="$2"
            local body headers auth_code

            echo "Checking $label public route: $base"
            body="$(curl --fail --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 5 --max-time 20 \
              "$base/health")"
            printf '%s' "$body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' || {
              echo "$label health endpoint did not report ok=true." >&2
              printf '%s\n' "$body" >&2
              return 1
            }

            headers="$(mktemp)"
            trap 'rm -f "$headers"' RETURN
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 5 --max-time 20 \
              -H "Origin: $FRONTEND_ORIGIN" \
              -D "$headers" -o /dev/null \
              "$base/auth/session"
            tr -d '\r' < "$headers" | grep -Fqi "access-control-allow-origin: $FRONTEND_ORIGIN" || {
              echo "$label is missing the expected CORS origin for the GitHub Pages frontend." >&2
              return 1
            }
            tr -d '\r' < "$headers" | grep -Fqi 'access-control-allow-credentials: true' || {
              echo "$label is missing Access-Control-Allow-Credentials: true." >&2
              return 1
            }

            auth_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 20 --max-redirs 0 \
              "$base/auth/discord?return_to=https%3A%2F%2Fnationalarchivesusar.github.io%2Fcommunications-studio%2F")"
            case "$auth_code" in
              301|302|303|307|308) ;;
              *) echo "$label Discord OAuth entrypoint returned HTTP $auth_code instead of a redirect." >&2; return 1 ;;
            esac

            echo "$label public login route passed health, CORS, and OAuth-entry checks."
            rm -f "$headers"
            trap - RETURN
          }

          # The frontend currently targets the historical :10000 endpoint, so it
          # is the required gate. Keep the bare 443 route healthy as the supported
          # fallback documented by the production runbook.
          check_route 'frontend-configured' "$LEGACY_PUBLIC_API_BASE"
          check_route 'bare-host' "$PUBLIC_API_BASE"

      - name: Deploy exact validated commit
        if: steps.activation.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CONTROL" || { echo 'Production control helper is not provisioned.'; exit 1; }
          sudo "$CONTROL" status
          sudo "$CONTROL" deploy "$GITHUB_SHA"
          sudo "$CONTROL" status
          sudo "$CONTROL" logs
          echo 'Production health gate passed.'

      - name: Verify deployed public login route
        if: steps.activation.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for base in "$LEGACY_PUBLIC_API_BASE" "$PUBLIC_API_BASE"; do
            echo "Rechecking public health after deployment: $base"
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 5 --max-time 20 \
              "$base/health" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          done
          echo 'Public Communications Studio routes remained healthy after deployment.'

      - name: Capture service logs on failure
        if: failure() && steps.activation.outputs.enabled == 'true'
        shell: bash
        run: |
          sudo "$CONTROL" status || true
          sudo "$CONTROL" logs || true

      - name: Publish production deployment status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_ENABLED: ${{ steps.activation.outputs.enabled }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENABLED" != 'true' ]; then
            state='error'
            description='Production auto-deploy activation is disabled'
          elif [ "$DEPLOY_JOB_STATUS" = 'success' ]; then
            state='success'
            description='Production systemd and public login health gates passed'
          else
            state='failure'
            description='Production deploy or public login health gate failed'
          fi
          payload=$(printf '{"state":"%s","context":"production-deploy","description":"%s","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$description" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
